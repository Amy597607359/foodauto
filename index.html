        function buildCloudPayload() {

            };

        function applyCloudPayload(payload) {
            if (!payload || typeof payload !== 'object') return false;

            // 计划
            if (payload.planData && typeof payload.planData === 'object') {
                for (let meal of MEALS) {
                    if (Array.isArray(payload.planData[meal]) && payload.planData[meal].length === 7) {
                        planData[meal] = payload.planData[meal].map(arr => Array.isArray(arr) ? arr.slice() : []);
                    }
                }
            }

            // 预设
            if (payload.presetData && typeof payload.presetData === 'object' && Object.keys(payload.presetData).length > 0) {
                presetData = payload.presetData;
            }

            // 食谱
            if (Array.isArray(payload.recipes)) {
                recipes = payload.recipes;
            }

            // 当前分类
            if (payload.activeCategory && presetData[payload.activeCategory]) {
                activeCategory = payload.activeCategory;
            } else {
                const keys = Object.keys(presetData);
                if (keys.length > 0) activeCategory = keys[0];
            }
            return true;
        }

        async function loadFromCloud() {
            const mask = document.getElementById('loadingMask');
            try {
                const res = await fetch(`${API_URL}/latest`, {
                    headers: { 'X-Access-Key': ACCESS_KEY }
                });
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const json = await res.json();
                const ok = applyCloudPayload(json.record);
                if (ok) {
                    setSyncStatus('☁️ 已从云端加载', 'ok');
                } else {
                    setSyncStatus('☁️ 云端无有效数据，使用默认', '');
                }
            } catch (e) {
                console.warn('云端加载失败，使用默认数据', e);
                setSyncStatus('⚠️ 云端加载失败，使用默认数据', 'err');
            } finally {
                dataLoaded = true;
                dirty = false;
                if (mask) mask.style.display = 'none';
            }
        }

            if (!dataLoaded) { showToast('数据还没加载完，请稍候'); return; }

            btn.textContent = '⏳ 保存中...';

            try {

        // ============ 营养计算 ============
        function findNutrient(name) {
            if (!name) return null;
            const clean = name.trim();
            if (NUTRIENT_DB[clean]) return NUTRIENT_DB[clean];
            let bestKey = null;
            for (const key in NUTRIENT_DB) {
                if (clean.includes(key) || key.includes(clean)) {
                    if (!bestKey || key.length > bestKey.length) bestKey = key;
                }
            }
            return bestKey ? NUTRIENT_DB[bestKey] : null;
        }

        function calcDayNutrition(dayIndex) {
            let total = { cal:0, pro:0, fat:0, carb:0, ca:0, fe:0, vc:0 };
            for (let meal of MEALS) {
                (planData[meal][dayIndex] || []).forEach(item => {
                    const nut = findNutrient(item);
                    if (nut) {
                        total.cal += nut.cal; total.pro += nut.pro; total.fat += nut.fat;
                        total.carb += nut.carb; total.ca += nut.ca; total.fe += nut.fe; total.vc += nut.vc;
                    }
                });
            }
            return total;
        }

            }
        }

        function renderAllCells() {
            for (let meal of MEALS) {
                for (let day = 0; day < 7; day++) {
                    const cell = getCellElement(meal, day);
                    if (!cell) continue;
                    cell.innerHTML = '';
                    const items = planData[meal][day] || [];
                    const wrap = document.createElement('div'); wrap.className = 'cell-items';

                    if (items.length === 0) {
                        const eh = document.createElement('div'); eh.className = 'empty-hint'; eh.textContent = '点击选中';
                        eh.addEventListener('click', e => { e.stopPropagation(); selectedCell = { meal, day }; updateSelectedHighlight(); showToast(`选中 ${DAYS[day]} ${MEAL_LABELS[meal]}`); });
                        wrap.appendChild(eh);
                    } else {
                        items.forEach((text, idx) => {
                            const el = document.createElement('div');
                            el.className = 'menu-item';
                            el.draggable = true;
                            el.dataset.meal = meal; el.dataset.day = day; el.dataset.index = idx; el.dataset.text = text;
                            const ts = document.createElement('span'); ts.className = 'item-text'; ts.textContent = text;
                            const db = document.createElement('button'); db.className = 'delete-btn'; db.innerHTML = '✕';
                            db.addEventListener('click', e => { e.stopPropagation(); planData[meal][day].splice(idx, 1); markDirty(); renderAllCells(); });
                            el.appendChild(ts); el.appendChild(db);
                            el.addEventListener('dragstart', handleDragStart); el.addEventListener('dragend', handleDragEnd);
                            el.addEventListener('dragover', handleDragOver); el.addEventListener('dragleave', handleDragLeave);
                            el.addEventListener('drop', handleDrop);
                            wrap.appendChild(el);
                        });
                    }
                    cell.appendChild(wrap);
                }
            }
            updateSelectedHighlight();
            updateDayNutriCards();
        }

        function handleDragStart(e) {
            const item = e.target.closest('.menu-item'); if (!item) return;
            dragSource = { meal: item.dataset.meal, day: parseInt(item.dataset.day), index: parseInt(item.dataset.index), text: item.dataset.text };
            e.dataTransfer.setData('text/plain', dragSource.text); e.dataTransfer.effectAllowed = 'move'; item.classList.add('dragging');
        }
        function handleDragEnd(e) {
            const item = e.target.closest('.menu-item'); if (item) item.classList.remove('dragging');
            document.querySelectorAll('.menu-item.drag-over, .grid-cell.drag-over').forEach(el => el.classList.remove('drag-over'));
            dragSource = null;
        }
        function handleDragOver(e) {
            e.preventDefault(); e.dataTransfer.dropEffect = 'move';
            const ti = e.target.closest('.menu-item'), tc = e.target.closest('.grid-cell');
            document.querySelectorAll('.menu-item.drag-over, .grid-cell.drag-over').forEach(el => el.classList.remove('drag-over'));
            if (ti) ti.classList.add('drag-over'); else if (tc) tc.classList.add('drag-over');
        }
        function handleDragLeave(e) { const ti = e.target.closest('.menu-item'), tc = e.target.closest('.grid-cell'); if (ti) ti.classList.remove('drag-over'); if (tc) tc.classList.remove('drag-over'); }
        function handleDrop(e) {
            e.preventDefault(); e.stopPropagation(); if (!dragSource) return;
            const ti = e.target.closest('.menu-item');
            if (ti) {
                const tm = ti.dataset.meal, td = parseInt(ti.dataset.day), tidx = parseInt(ti.dataset.index);
                if (dragSource.meal === tm && dragSource.day === td && dragSource.index === tidx) { dragSource = null; return; }
                moveItem(dragSource, { meal: tm, day: td, index: tidx }); dragSource = null;
            }
        }
        function handleDropOnCell(e, meal, day) {
            e.preventDefault(); if (!dragSource) return;
            const ti = planData[meal][day].length;
            if (dragSource.meal === meal && dragSource.day === day) {
                const sa = planData[meal][day]; if (dragSource.index === sa.length - 1 && ti === sa.length) { dragSource = null; return; }
            }
            moveItem(dragSource, { meal, day, index: ti }); dragSource = null;
        }
        function moveItem(src, dest) {
            const sm = src.meal, sd = src.day, si = src.index, st = src.text;
            const dm = dest.meal, dd = dest.day; let di = dest.index;
            const sa = planData[sm][sd], da = planData[dm][dd];
            if (!sa || sa[si] !== st) { const ri = sa.indexOf(st); if (ri === -1) return; sa.splice(ri, 1); } else { sa.splice(si, 1); }
            if (sm === dm && sd === dd) { if (si < di) di--; if (di < 0) di = 0; if (di > da.length) di = da.length; } else { if (di > da.length) di = da.length; }
            da.splice(di, 0, st); markDirty(); renderAllCells();
        }

        function renderCategoryTabs() {
            categoryTabsEl.innerHTML = '';
            const cats = Object.keys(presetData);
            if (cats.length === 0) { activeCategory = null; return; }
            if (!activeCategory || !presetData[activeCategory]) activeCategory = cats[0];
            cats.forEach(cat => {
                const tab = document.createElement('div');
                let cls = 'category-tab';
                if (cat === activeCategory) cls += ' active';
                if (cat.includes('建议')) cls += ' recommend';
                if (cat.includes('避免')) cls += ' avoid';
                tab.className = cls;
                const ns = document.createElement('span'); ns.textContent = cat;
                const cs = document.createElement('span'); cs.className = 'tab-count'; cs.textContent = presetData[cat].length;
                const db = document.createElement('button'); db.className = 'tab-del'; db.innerHTML = '✕';
                db.addEventListener('click', e => {
                    e.stopPropagation();
                    if (Object.keys(presetData).length <= 1) { showToast('至少保留一个分类'); return; }
                    showConfirmModal(`确定删除分类「${cat}」及其中所有预设吗？`, () => {
                        delete presetData[cat];
                        if (activeCategory === cat) activeCategory = Object.keys(presetData)[0];
                        markDirty();
                        renderCategoryTabs(); renderPresetList();
                    });
                });
                tab.appendChild(ns); tab.appendChild(cs); tab.appendChild(db);
                tab.addEventListener('click', e => { if (e.target.closest('.tab-del')) return; activeCategory = cat; markDirty(); renderCategoryTabs(); renderPresetList(); });
                categoryTabsEl.appendChild(tab);
            });
            const addTab = document.createElement('div'); addTab.className = 'category-tab'; addTab.style.cssText = 'border-style:dashed;color:#64748b;'; addTab.textContent = '+ 分类';
            addTab.addEventListener('click', () => {
                showInputModal('新建分类', '输入分类名称，例如：汤品', '', (value) => {
                    if (!value) return;
                    if (presetData[value]) { showToast('分类已存在'); return; }
                    presetData[value] = [];
                    activeCategory = value;
                    markDirty();
                    renderCategoryTabs(); renderPresetList();
                    showToast(`已添加分类「${value}」`);
                });
            });
            categoryTabsEl.appendChild(addTab);
        }

        function renderPresetList() {
            presetListEl.innerHTML = '';
            if (!activeCategory || !presetData[activeCategory]) { presetListEl.innerHTML = '<div class="preset-empty">暂无分类</div>'; return; }
            const items = presetData[activeCategory];
            if (items.length === 0) { presetListEl.innerHTML = '<div class="preset-empty">该分类暂无预设</div>'; return; }
            items.forEach((text, idx) => {
                const item = document.createElement('div'); item.className = 'preset-item';
                const ts = document.createElement('span'); ts.className = 'preset-text'; ts.innerHTML = `${text} <span>+</span>`;
                ts.addEventListener('click', () => {
                    const { meal, day } = selectedCell; planData[meal][day].push(text); markDirty(); renderAllCells();
                    showToast(`已添加「${text}」到 ${DAYS[day]} ${MEAL_LABELS[meal]}`);
                });
                const db = document.createElement('button'); db.className = 'delete-preset-btn'; db.innerHTML = '✕';
                db.addEventListener('click', e => { e.stopPropagation(); presetData[activeCategory].splice(idx, 1); markDirty(); renderCategoryTabs(); renderPresetList(); });
                item.appendChild(ts); item.appendChild(db); presetListEl.appendChild(item);
            });
        }

        addPresetBtn.addEventListener('click', () => {
            if (!activeCategory || !presetData[activeCategory]) { showToast('请先选择分类'); return; }
            showInputModal(`添加到「${activeCategory}」`, '输入菜品名称，例如：番茄牛腩', '', (value) => {
                if (!value) return;
                if (presetData[activeCategory].includes(value)) { showToast('该菜品已存在'); return; }
                presetData[activeCategory].push(value);
                markDirty();
                renderCategoryTabs(); renderPresetList();
                showToast(`已添加「${value}」到「${activeCategory}」`);
            });
        });

        // ============ 食谱集 ============
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function renderRecipes() {
            const f = recipeSearchText.trim().toLowerCase();
            const list = recipes.filter(r => {
                if (!f) return true;
                return (r.name || '').toLowerCase().includes(f) ||
                       (r.tag || '').toLowerCase().includes(f) ||
                       (r.ingredients || '').toLowerCase().includes(f) ||
                       (r.steps || '').toLowerCase().includes(f);
            });

            if (list.length === 0) {
                recipeGrid.innerHTML = `
                    <div class="recipe-empty">
                        <span class="big-icon">📭</span>
                        ${recipes.length === 0 ? '还没有食谱，点击右上角“+ 新建食谱”开始记录吧' : '没有找到匹配的食谱'}
                    </div>
                `;
                return;
            }

            list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

            recipeGrid.innerHTML = '';
            list.forEach(r => {
                const card = document.createElement('div');
                card.className = 'recipe-card';
                card.innerHTML = `
                    <div class="recipe-title">
                        <span class="title-text">${escapeHtml(r.name || '未命名食谱')}</span>
                        <div class="recipe-card-actions">
                            <button class="icon-btn edit" data-id="${r.id}" title="编辑">✏️</button>
                            <button class="icon-btn delete" data-id="${r.id}" title="删除">🗑️</button>
                        </div>
                    </div>
                    ${r.tag ? `<span class="recipe-tag">${escapeHtml(r.tag)}</span>` : ''}
                    ${r.ingredients ? `<div class="recipe-field ingredients"><strong>食材：</strong>${escapeHtml(r.ingredients).replace(/\n/g, '<br>')}</div>` : ''}
                    ${r.steps ? `<div class="recipe-field steps"><strong>做法：</strong>${escapeHtml(r.steps).replace(/\n/g, '<br>')}</div>` : ''}
                    ${r.notes ? `<div class="recipe-notes">💡 ${escapeHtml(r.notes)}</div>` : ''}
                `;
                recipeGrid.appendChild(card);
            });

            recipeGrid.querySelectorAll('.icon-btn.edit').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = btn.dataset.id;
                    const recipe = recipes.find(x => x.id === id);
                    if (recipe) openRecipeModal(recipe);
                });
            });
            recipeGrid.querySelectorAll('.icon-btn.delete').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = btn.dataset.id;
                    const recipe = recipes.find(x => x.id === id);
                    if (!recipe) return;
                    showConfirmModal(`确定删除食谱「${recipe.name}」吗？`, () => {
                        recipes = recipes.filter(x => x.id !== id);
                        markDirty();
                        renderRecipes();
                        showToast('已删除食谱，记得保存到云端');
                    });
                });
            });
        }

        function openRecipeModal(recipe = null) {
            editingRecipeId = recipe ? recipe.id : null;
            if (recipe) {
                recipeModalTitle.innerHTML = '<span>✏️</span> 编辑食谱';
                recipeName.value = recipe.name || '';
                recipeTag.value = recipe.tag || '';
                recipeIngredients.value = recipe.ingredients || '';
                recipeSteps.value = recipe.steps || '';
                recipeNotes.value = recipe.notes || '';
            } else {
                recipeModalTitle.innerHTML = '<span>📝</span> 新建食谱';
                recipeName.value = '';
                recipeTag.value = '';
                recipeIngredients.value = '';
                recipeSteps.value = '';
                recipeNotes.value = '';
            }
            recipeModal.classList.add('show');
            setTimeout(() => recipeName.focus(), 100);
        }

        function closeRecipeModal() { recipeModal.classList.remove('show'); editingRecipeId = null; }

        function saveRecipe() {
            const name = recipeName.value.trim();
            if (!name) { showToast('请填写食谱名称'); recipeName.focus(); return; }

            const data = {
                name,
                tag: recipeTag.value.trim(),
                ingredients: recipeIngredients.value.trim(),
                steps: recipeSteps.value.trim(),
                notes: recipeNotes.value.trim()
            };

            if (editingRecipeId) {
                const idx = recipes.findIndex(x => x.id === editingRecipeId);
                if (idx !== -1) recipes[idx] = { ...recipes[idx], ...data };
                showToast('已更新食谱');
            } else {
                recipes.push({
                    id: 'r' + Date.now() + Math.random().toString(36).slice(2, 8),
                    ...data,
                    createdAt: Date.now()
                });
                showToast('已保存食谱');
            }

            markDirty();
            renderRecipes();
            closeRecipeModal();
        }

        addRecipeBtn.addEventListener('click', () => openRecipeModal(null));
        saveRecipeBtn.addEventListener('click', saveRecipe);
        cancelRecipeBtn.addEventListener('click', closeRecipeModal);
        closeRecipeModalBtn.addEventListener('click', closeRecipeModal);
        recipeModal.addEventListener('click', e => { if (e.target === recipeModal) closeRecipeModal(); });

        recipeSearch.addEventListener('input', e => { recipeSearchText = e.target.value; renderRecipes(); });

        // ============ 导出 Excel ============
        exportExcelBtn.addEventListener('click', () => {
            if (recipes.length === 0) { showToast('没有食谱可导出'); return; }
            try {
                const rows = recipes
                    .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0))
                    .map((r, i) => ({
                        '序号': i + 1,
                        '食谱名称': r.name || '',
                        '标签/分类': r.tag || '',
                        '食材': r.ingredients || '',
                        '做法步骤': r.steps || '',
                        '备注/营养提示': r.notes || '',
                        '创建时间': r.createdAt ? new Date(r.createdAt).toLocaleString('zh-CN') : ''
                    }));

                const ws = XLSX.utils.json_to_sheet(rows, {
                    header: ['序号', '食谱名称', '标签/分类', '食材', '做法步骤', '备注/营养提示', '创建时间']
                });

                ws['!cols'] = [
                    { wch: 6 }, { wch: 20 }, { wch: 20 }, { wch: 40 }, { wch: 60 }, { wch: 30 }, { wch: 20 }
                ];

                const range = XLSX.utils.decode_range(ws['!ref']);
                for (let R = range.s.r; R <= range.e.r; ++R) {
                    for (let C = range.s.c; C <= range.e.c; ++C) {
                        const addr = XLSX.utils.encode_cell({ r: R, c: C });
                        const cell = ws[addr];
                        if (cell) cell.s = { alignment: { wrapText: true, vertical: 'top' } };
                    }
                }

                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, '食谱集');

                try {
                    const planRows = [];
                    DAYS.forEach((dayName, dayIdx) => {
                        MEALS.forEach(meal => {
                            const items = planData[meal][dayIdx] || [];
                            if (items.length > 0) {
                                planRows.push({ '星期': dayName, '餐次': MEAL_LABELS[meal], '菜品': items.join('、') });
                            }
                        });
                    });
                    if (planRows.length > 0) {
                        const ws2 = XLSX.utils.json_to_sheet(planRows);
                        ws2['!cols'] = [{ wch: 10 }, { wch: 10 }, { wch: 60 }];
                        XLSX.utils.book_append_sheet(wb, ws2, '本周饮食计划');
                    }
                } catch (e) { console.warn('附加计划失败', e); }

                const fileName = `食谱集_${new Date().toISOString().slice(0, 10)}.xlsx`;
                XLSX.writeFile(wb, fileName);
                showToast('已导出 Excel 文件');
            } catch (err) {
                console.error(err);
                showToast('导出失败：' + err.message);
            }
        });

        // ============ 导出/导入 JSON ============
        exportRecipeBtn.addEventListener('click', () => {
            const dataStr = JSON.stringify(recipes, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `食谱集_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('已导出 JSON 文件');
        });

        importRecipeBtn.addEventListener('click', () => {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json,application/json';
            input.addEventListener('change', e => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = ev => {
                    try {
                        const data = JSON.parse(ev.target.result);
                        if (!Array.isArray(data)) throw new Error('格式不正确');
                        const existingIds = new Set(recipes.map(r => r.id));
                        const existingNames = new Set(recipes.map(r => r.name));
                        let added = 0;
                        data.forEach(item => {
                            if (!item.name) return;
                            if (existingIds.has(item.id) || existingNames.has(item.name)) return;
                            recipes.push({
                                id: item.id || ('r' + Date.now() + Math.random().toString(36).slice(2, 8)),
                                name: item.name,
                                tag: item.tag || '',
                                ingredients: item.ingredients || '',
                                steps: item.steps || '',
                                notes: item.notes || '',
                                createdAt: item.createdAt || Date.now()
                            });
                            added++;
                        });
                        markDirty();
                        renderRecipes();
                        showToast(`成功导入 ${added} 条食谱，记得保存到云端`);
                    } catch (err) {
                        showToast('导入失败：文件格式不正确');
                    }
                };
                reader.readAsText(file);
            });
            input.click();
        });

        // ============ 重置 / 清空 ============
        function resetToDefault() {
            planData = { breakfast: [[],[],[],[],[],[],[]], lunch: [[],[],[],[],[],[],[]], dinner: [[],[],[],[],[],[],[]] };
            for (let meal of MEALS) for (let day = 0; day < 7; day++) planData[meal][day] = [...DEFAULT_PLAN[meal][day]];
            presetData = JSON.parse(JSON.stringify(DEFAULT_PRESET_DATA));
            activeCategory = '✅ 术后建议';
            selectedCell = { meal: 'breakfast', day: 0 };
            markDirty();
            renderAllCells(); renderCategoryTabs(); renderPresetList();
            showToast('已恢复示例，记得保存到云端');
        }

        function clearAll() {
            for (let meal of MEALS) for (let day = 0; day < 7; day++) planData[meal][day] = [];
            selectedCell = { meal: 'breakfast', day: 0 };
            markDirty();
            renderAllCells(); showToast('已清空，记得保存到云端');
        }

        // ============ 初始化 ============
        async function init() {
            buildGridSkeleton();

            // 先用默认值铺满，避免加载前空白
            for (let meal of MEALS) for (let day = 0; day < 7; day++) planData[meal][day] = [...DEFAULT_PLAN[meal][day]];
            recipes = JSON.parse(JSON.stringify(DEFAULT_RECIPES));

            await loadFromCloud();

            renderAllCells();
            renderCategoryTabs();
            renderPresetList();
            selectedCell = { meal: 'breakfast', day: 0 };
            updateSelectedHighlight();
            renderRecipes();

            clearAllBtn.addEventListener('click', clearAll);
            resetDefaultBtn.addEventListener('click', resetToDefault);
            document.addEventListener('dragover', e => e.preventDefault());
            document.addEventListener('drop', e => e.preventDefault());
        }
        init();
    })();
</script>
</body>
</html>
